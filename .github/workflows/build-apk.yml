# CI trigger for Clinical Photo Archive v1.1.0
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/patient-edit-fullscreen-scalpel-icon
    paths-ignore:
      - 'ci-output/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare CI output
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          cp build.log ci-output/build.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ci-output/ClinicalPhotoArchive-v1.1.0-debug.apk
          fi

      - name: Commit CI output
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ci-output/build.log
          if [ -f ci-output/ClinicalPhotoArchive-v1.1.0-debug.apk ]; then
            git add -- ci-output/ClinicalPhotoArchive-v1.1.0-debug.apk
          fi
          git commit -m "Publish v1.1.0 CI build output" || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload APK artifact
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalPhotoArchive-v1.1.0-debug-apk
          path: ci-output/ClinicalPhotoArchive-v1.1.0-debug.apk
          if-no-files-found: error

      - name: Fail if compilation failed
        if: steps.build.outputs.status != '0'
        run: exit 1
