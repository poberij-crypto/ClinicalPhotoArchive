name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/patient-edit-fullscreen-scalpel-icon

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare APK name
        if: steps.build.outputs.status == '0'
        run: cp app/build/outputs/apk/debug/app-debug.apk ClinicalPhotoArchive-v1.1.0-debug.apk

      - name: Upload APK artifact
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalPhotoArchive-v1.1.0-debug-apk
          path: ClinicalPhotoArchive-v1.1.0-debug.apk
          if-no-files-found: error

      - name: Publish build result release
        if: always() && github.ref == 'refs/heads/feature/patient-edit-fullscreen-scalpel-icon'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="clinical-photo-archive-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build.log --clobber
            if [ -f ClinicalPhotoArchive-v1.1.0-debug.apk ]; then
              gh release upload "$TAG" ClinicalPhotoArchive-v1.1.0-debug.apk --clobber
            fi
          else
            if [ -f ClinicalPhotoArchive-v1.1.0-debug.apk ]; then
              gh release create "$TAG" build.log ClinicalPhotoArchive-v1.1.0-debug.apk \
                --target "$GITHUB_SHA" \
                --title "Clinical Photo Archive v1.1.0 test build" \
                --notes "Automated test build with patient editing, fullscreen photo viewing, and scalpel icon."
            else
              gh release create "$TAG" build.log \
                --target "$GITHUB_SHA" \
                --title "Clinical Photo Archive v1.1.0 build diagnostics" \
                --notes "Build failed; see build.log."
            fi
          fi

      - name: Fail if compilation failed
        if: steps.build.outputs.status != '0'
        run: exit 1
